<div class="blank-layout-container justify-content-center">
  <div class="position-relative row w-100 h-100">
    <div class="col-lg-7 col-xl-8 bg-gredient p-0">
      <div class="p-24 h-100">
        <a [routerLink]="['/dashboards/dashboard1']" *ngIf="options.theme === 'light'">
          <img src="./assets/images/logos/dark-logo.svg" class="align-middle m-2" alt="logo" />
        </a>
        <a [routerLink]="['/dashboards/dashboard1']" *ngIf="options.theme === 'dark'">
          <img src="./assets/images/logos/light-logo.svg" class="align-middle m-2" alt="logo" />
        </a>

        <div class="align-items-center justify-content-center img-height d-none d-lg-flex">
          <img src="/assets/images/backgrounds/login.png" alt="login" style="max-width: 500px" />
        </div>
      </div>
    </div>
    <div class="col-lg-5 col-xl-4 p-0">
      <div class="p-32 d-flex align-items-start align-items-lg-center justify-content-center h-100">
        <div class="row justify-content-center w-100">
          <div class="col-lg-9 max-width-form">
            <h4 class="f-w-700 f-s-24 m-0">Welcome to Clinic</h4>
            <!-- <span class="f-s-14 d-block mat-body-1 m-t-8">Your Dashboard</span> -->

            <form class="m-t-30" [formGroup]="form" (ngSubmit)="submit()">

              <!-- Username -->

              <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">User Type</mat-label>
                <mat-form-field appearance="outline" class="w-100" color="primary">
                  <mat-select #dropdown formControlName="userType" placeholder="Select user type">
                    <mat-option [value]="item.typeName" *ngFor="let item of userTypeList">{{item.typeName}}</mat-option>
                </mat-select>
                    <mat-hint *ngIf="f['userType'].touched && f['userType'].invalid" class="m-b-16 error-msg">
                      <div class="text-error" *ngIf="f['userType'].errors && f['userType'].errors['required']">
                        User type is required.
                      </div>
                    </mat-hint>
                </mat-form-field>

              <!-- email -->
              <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Email</mat-label>
              <mat-form-field appearance="outline" class="w-100" color="primary">
                <input matInput formControlName="email" />
                <mat-hint *ngIf="f['email'].touched && f['email'].invalid" class="m-b-16 error-msg">
                  <div class="text-error" *ngIf="f['email'].errors && f['email'].errors['required']">
                    Email is required.
                  </div>
                </mat-hint>
              </mat-form-field>

              <!-- password -->
              <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Password</mat-label>
              <mat-form-field appearance="outline" class="w-100" color="primary">
                <input matInput type="password" formControlName="password" />
                <mat-hint *ngIf="f['password'].touched && f['password'].invalid" class="m-b-16 error-msg">
                  <div class="text-error" *ngIf="
                      f['password'].errors && f['password'].errors['required']
                    ">
                    Password is required.
                  </div>
                </mat-hint>
              </mat-form-field>

              <div class="d-flex align-items-center m-b-12">
                <mat-checkbox color="primary">Remember this Device</mat-checkbox>
                <a [routerLink]="['/authentication/side-forgot-pwd']"
                  class="text-primary f-w-600 text-decoration-none m-l-auto f-s-14">Forgot Password ?</a>
              </div>
              <button mat-flat-button color="primary" class="w-100" [disabled]="!form.valid">
                Sign In
              </button>
            </form>
            <span class="d-block f-w-500 d-block m-t-24">New to GadiCure?
              <a [routerLink]="['/authentication/side-register']"
                class="text-decoration-none text-primary f-w-500 f-s-14">
                Create an account</a>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

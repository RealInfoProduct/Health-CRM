<mat-card class="cardWithShadow">
  <mat-card-content class="p-24">
    <div class="row justify-content-between">
      <div class="col-lg-4">
        <mat-form-field appearance="outline" class="w-100 hide-hint">
          <input matInput placeholder="Search  Medicine" />
          <mat-icon matSuffix>
            <i-tabler name="search" class="icon-20"></i-tabler>
          </mat-icon>
        </mat-form-field>
      </div>
      <div class="col-lg-4 d-flex align-items-center justify-content-end">
            <button mat-flat-button (click)="openDialog('Add', {})" color="primary">
              Add Medicine
            </button>
          </div>
    </div>
  </mat-card-content>
</mat-card>

<mat-card class="cardWithShadow">
  <mat-card-content class="p-24">
    <div class="table-responsive">
      <table mat-table [dataSource]="dataSource" class="w-100">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">No.</th>
          <td mat-cell *matCellDef="let element;  let i = index ">{{ i + 1 }}</td>
        </ng-container>

        <ng-container matColumnDef="medicineName">
          <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600"> Medicine Name </th>
          <td mat-cell *matCellDef="let element" class="f-s-14">{{ element.medicineName }}</td>
        </ng-container>

        <ng-container matColumnDef="companyName">
          <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600"> Company Name </th>
          <td mat-cell *matCellDef="let element" class="f-s-14">{{ element.companyName }}</td>
        </ng-container>

        <ng-container matColumnDef="dosage">
          <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600"> Dosage </th>
          <td mat-cell *matCellDef="let element" class="f-s-14">{{ element.dosage }}</td>
        </ng-container>

        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600"> Price </th>
          <td mat-cell *matCellDef="let element" class="f-s-14">{{ element.price }}</td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">
            Action
          </th>
          <td mat-cell *matCellDef="let element" class="action-link">
            <a (click)="openDialog('Update', element)" class="m-r-10 cursor-pointer">
              <i-tabler name="edit" class="icon-18"></i-tabler>
            </a>
            <a (click)="openDialog('Delete', element)" class="m-r-10 cursor-pointer">
              <i-tabler name="trash" class="icon-18"></i-tabler>
            </a>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="medicineColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: medicineColumns"></tr>
        <tr class="mat-row" style="text-align: center;" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="medicineColumns.length">
            No record found
          </td>
        </tr>

      </table>
      <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
